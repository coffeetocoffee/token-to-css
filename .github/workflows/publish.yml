name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - name: Install (link workspaces)
        run: npm install
      - name: Test
        run: npm test
      # -- v11.5 per-package publishing -------------------------------------
      # A change touching only one package publishes exactly that package;
      # the meta package publishes when its own version is new on npm.
      - name: Check if version already published (@token-to-css/core)
        id: check-core
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if npm view "@token-to-css/core@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish @token-to-css/core
        if: steps.check-core.outputs.published != 'true'
        run: npm publish --provenance --access public
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Check if version already published (@token-to-css/connectors)
        id: check-connectors
        run: |
          VERSION=$(node -p "require('./packages/connectors/package.json').version")
          if npm view "@token-to-css/connectors@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish @token-to-css/connectors
        if: steps.check-connectors.outputs.published != 'true'
        run: npm publish --provenance --access public
        working-directory: packages/connectors
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # -- meta package (batteries-included, unchanged contract) ------------
      - name: Check if version already published (token-to-css meta)
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "token-to-css@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish token-to-css (meta)
        if: steps.check.outputs.published != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
