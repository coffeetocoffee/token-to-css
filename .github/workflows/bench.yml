name: Performance Bench

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (link workspaces)
        run: npm install
      - name: Run v13 performance benchmark
        run: npm run bench
